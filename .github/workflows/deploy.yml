name: Deploy to VPS v2

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.VPS_APP_DIR }}"

            echo "-> Moving to app dir"
            cd "$APP_DIR"

            echo "-> Ensure GitHub host key is known"
            sudo -u app mkdir -p /home/app/.ssh
            sudo -u app chmod 700 /home/app/.ssh
            sudo -u app ssh-keyscan -H github.com >> /home/app/.ssh/known_hosts
            sudo -u app chmod 644 /home/app/.ssh/known_hosts

            echo "-> Mark repo as safe (only once)"
            sudo -u app git config --global --get-all safe.directory | grep -qx "$APP_DIR" || \
              sudo -u app git config --global --add safe.directory "$APP_DIR"

            echo "-> Pulling latest code as app"
            sudo -u app git fetch --all
            sudo -u app git reset --hard origin/master

            echo "-> HARD STOP old systemd Streamlit service (prevents port 8501 conflicts)"
            sudo -n systemctl stop church-scheduler 2>/dev/null || true
            sudo -n systemctl disable church-scheduler 2>/dev/null || true
            sudo -n systemctl mask church-scheduler 2>/dev/null || true

            echo "-> Stop old container stack (if any) + remove orphans"
            sudo -u app docker compose down --remove-orphans || true

            echo "-> Build + start containers"
            sudo -u app docker compose build
            sudo -u app docker compose up -d --remove-orphans

            echo "-> Check status"
            sudo -u app docker compose ps

            echo "-> Quick health check (local only)"
            curl -fsS http://127.0.0.1:8501/_stcore/health || true
            curl -fsS http://127.0.0.1:8501/ | head -n 3 || true

            echo "-> Nginx config test + reload"
            sudo -n nginx -t
            sudo -n systemctl reload nginx

            echo "-> Logs (tail)"
            sudo -u app docker compose logs --tail=120 app || true
            sudo -u app docker compose logs --tail=120 db || true