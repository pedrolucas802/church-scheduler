name: deploy

on:
  push:
    branches: [ "master" ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail

            APP_DIR="/home/app/apps/church-scheduler"

            echo "-> Moving to app dir"
            cd "$APP_DIR"

            echo "-> Ensure GitHub host key is known (for user app)"
            sudo -u app mkdir -p /home/app/.ssh
            sudo -u app chmod 700 /home/app/.ssh
            sudo -u app ssh-keyscan -H github.com >> /home/app/.ssh/known_hosts
            sudo -u app chmod 644 /home/app/.ssh/known_hosts

            echo "-> Mark repo as safe (only once)"
            sudo -u app git config --global --get-all safe.directory | grep -qx "$APP_DIR" || \
              sudo -u app git config --global --add safe.directory "$APP_DIR"

            echo "-> Pulling latest code as app"
            sudo -u app git fetch --all
            sudo -u app git reset --hard origin/master

            echo "-> Docker compose deploy (explicit .env)"
            # IMPORTANT: this avoids the 'POSTGRES_PASSWORD not set' warning
            sudo docker compose --env-file .env pull || true
            sudo docker compose --env-file .env up -d --build --remove-orphans

            echo "-> Containers status"
            sudo docker compose --env-file .env ps

            echo "-> Waiting for Streamlit health..."
            for i in {1..30}; do
              if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
                echo "health ✅"
                break
              fi
              sleep 1
            done

            echo "-> Quick health check (local)"
            curl -fsS http://127.0.0.1:8501/_stcore/health || (echo "health failed ❌" && sudo docker logs --tail=120 church_app && exit 1)
            curl -I http://127.0.0.1:8501 | head -n 10 || true

            echo "-> Quick public check (domain)"
            curl -fsS https://churchschedule.tech/_stcore/health && echo "public health ✅" || true

            echo "-> Last logs"
            sudo docker logs --tail=120 church_app || true