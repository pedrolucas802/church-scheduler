name: Deploy to VPS

on:
  push:
    branches: ["master"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd ${{ secrets.VPS_APP_DIR }}

            # ensure github host key is known (avoids Host key verification failed)
            mkdir -p /home/app/.ssh
            chmod 700 /home/app/.ssh
            ssh-keyscan -H github.com >> /home/app/.ssh/known_hosts
            chmod 644 /home/app/.ssh/known_hosts
            chown -R app:app /home/app/.ssh

            # avoid "dubious ownership"
            sudo -u app git config --global --add safe.directory ${{ secrets.VPS_APP_DIR }}

            # pull latest as app (app has the GitHub repo key)
            sudo -u app git fetch --all
            sudo -u app git reset --hard origin/master

            # install deps as app
            sudo -u app ${{ secrets.VPS_APP_DIR }}/.venv/bin/pip install -r ${{ secrets.VPS_APP_DIR }}/requirements.txt

            # restart service (needs sudo)
            sudo -n /usr/bin/systemctl restart church-scheduler
            sudo -n /usr/bin/systemctl status church-scheduler --no-pager