name: Deploy to VPS

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.VPS_APP_DIR }}"

            echo "-> Moving to app dir"
            cd "$APP_DIR"

            echo "-> Ensure GitHub host key is known (for user app)"
            sudo -u app mkdir -p /home/app/.ssh
            sudo -u app chmod 700 /home/app/.ssh
            sudo -u app ssh-keyscan -H github.com >> /home/app/.ssh/known_hosts
            sudo -u app chmod 644 /home/app/.ssh/known_hosts

            echo "-> Mark repo as safe (only once)"
            sudo -u app git config --global --get-all safe.directory | grep -qx "$APP_DIR" || \
              sudo -u app git config --global --add safe.directory "$APP_DIR"

            echo "-> Pulling latest code as app"
            sudo -u app git fetch --all
            sudo -u app git reset --hard origin/master

            echo "-> Docker compose deploy"
            # IMPORTANT: app user must be in docker group OR we run docker with sudo.
            # If 'app' is in docker group, you can drop sudo below.
            sudo docker compose pull || true
            sudo docker compose build --no-cache
            sudo docker compose up -d --remove-orphans

            echo "-> Containers status"
            sudo docker compose ps

            echo "-> Quick health check (local)"
            curl -fsS http://127.0.0.1:8501/_stcore/health || true
            curl -I http://127.0.0.1:8501 || true

            echo "-> Last logs"
            sudo docker logs --tail=80 church_app || true