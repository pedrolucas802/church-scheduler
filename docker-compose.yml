services:
  db:
    image: postgres:16-alpine
    container_name: church_scheduler_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: church_scheduler
      POSTGRES_USER: church_admin
      POSTGRES_PASSWORD: church_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata_church:/var/lib/postgresql/data

volumes:
  pgdata_church: