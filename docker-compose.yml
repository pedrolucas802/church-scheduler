services:
  db:
    image: postgres:16-alpine
    container_name: church_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: church_scheduler
      POSTGRES_USER: church_admin
      POSTGRES_PASSWORD: church_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata_church:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U church_admin -d church_scheduler"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: church_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8501:8501"

volumes:
  pgdata_church: