# docker-compose.local.yml
services:
  db_local:
    image: postgres:16
    container_name: db_local
    environment:
      POSTGRES_DB: church_scheduler
      POSTGRES_USER: church_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - church_db_data:/var/lib/postgresql/data
      # NOTE: we are using SQLAlchemy metadata.create_all via src/db/init.py
      # so we DO NOT mount ./db/init here.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U church_admin -d church_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak_db_local:
    image: postgres:16
    container_name: keycloak_db_local
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak_local:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak_local
    depends_on:
      keycloak_db_local:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db_local:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}

      # Keycloak 25+: hostname v2
      KC_FEATURES: "hostname:v2"

      # Public issuer base (what the browser uses)
      KC_HOSTNAME: "http://localhost:8081"
      KC_HOSTNAME_STRICT: "false"

      # Dev options
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

    volumes:
      # Realm import file (must exist on host)
      - ./keycloak/realm-churchschedule.json:/opt/keycloak/data/import/realm-churchschedule.json:ro

    command: ["start-dev", "--import-realm"]

  # Runs once, exits. App depends on it completing successfully.
  seed_local:
    build:
      context: .
      dockerfile: Dockerfile
    image: church-scheduler-church_app:latest
    container_name: seed_local
    depends_on:
      db_local:
        condition: service_healthy
      keycloak_local:
        condition: service_started
    working_dir: /app
    environment:
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL}
      KC_BASE_URL: ${KC_BASE_URL}
      KC_PUBLIC_BASE_URL: ${KC_PUBLIC_BASE_URL}
      KC_REALM: ${KC_REALM}
      KC_CLIENT_ID: ${KC_CLIENT_ID}
      KC_CLIENT_SECRET: ${KC_CLIENT_SECRET}
      KC_ADMIN_USER: ${KC_ADMIN_USER}
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    command:
      - bash
      - -lc
      - |
        python -c "from src.db.init import init_db; init_db()"
        python -m src.scripts.seed_mock_data
    restart: "no"

  church_app_local:
    build:
      context: .
      dockerfile: Dockerfile
    image: church-scheduler-church_app:latest
    container_name: church_app_local
    depends_on:
      db_local:
        condition: service_healthy
      keycloak_local:
        condition: service_started
      seed_local:
        condition: service_completed_successfully
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: ${DATABASE_URL}

      # Container -> Keycloak (internal Docker network)
      KC_BASE_URL: ${KC_BASE_URL}

      # Browser -> Keycloak (public address)
      KC_PUBLIC_BASE_URL: ${KC_PUBLIC_BASE_URL}

      KC_REALM: ${KC_REALM}
      KC_CLIENT_ID: ${KC_CLIENT_ID}
      KC_CLIENT_SECRET: ${KC_CLIENT_SECRET}

      APP_BASE_URL: ${APP_BASE_URL}
      KC_REDIRECT_URI: ${KC_REDIRECT_URI}

      COOKIE_SECRET: ${COOKIE_SECRET}

volumes:
  church_db_data:
  keycloak_db_data: