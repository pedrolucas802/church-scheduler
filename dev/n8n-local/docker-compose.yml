services:
  n8n:
    image: n8nio/n8n:2.4.6
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_EDITOR_BASE_URL=http://localhost:5678
      - WEBHOOK_URL=http://localhost:5678
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=America/Fortaleza
    volumes:
      - ./data:/home/node/.n8n